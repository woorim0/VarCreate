<!DOCTYPE html>

<html lang="ko"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>변수생성기</title>

<style>
	:root {
		color-scheme: dark;
		--ink: #d4d4d4;
		--muted: #9da3a8;
		--line: #3c3c3c;
		--surface: #252526;
		--accent: #007acc;
		--accent-hover: #0062a3;
	}

	* {
		box-sizing: border-box;
	}

	[hidden] {
		display: none !important;
	}

	body {
		margin: 0;
		min-height: 100vh;
		background-color: #1e1e1e;
		background-image: radial-gradient(rgba(255, 255, 255, 0.035) 0.7px, transparent 0.7px);
		background-size: 24px 24px;
		color: var(--ink);
		font-family:
			"Pretendard",
			"Apple SD Gothic Neo",
			-apple-system,
			BlinkMacSystemFont,
			"Segoe UI",
			sans-serif;
	}

	.setup-screen {
		display: grid;
		min-height: 100vh;
		place-items: center;
		padding: 28px 20px;
	}

	.setup-panel {
		width: min(100%, 440px);
		padding: 32px;
		border: 1px solid #3c3c3c;
		border-radius: 20px;
		background: #252526;
		box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
	}

	.setup-eyebrow {
		margin: 0 0 12px;
		color: #75beff;
		font-family: "SFMono-Regular", Consolas, monospace;
		font-size: 12px;
	}

	.setup-panel h1 {
		font-size: 26px;
		font-weight: 650;
	}

	.setup-description {
		margin: 12px 0 24px;
		color: var(--muted);
		font-size: 14px;
		line-height: 1.65;
	}

	.setup-label {
		display: block;
		margin-bottom: 8px;
		color: #cccccc;
		font-size: 13px;
		font-weight: 600;
	}

	.setup-input {
		width: 100%;
		height: 46px;
		padding: 0 13px;
		border: 1px solid #454545;
		border-radius: 10px;
		outline: 0;
		background: #1e1e1e;
		color: var(--ink);
		font: inherit;
		font-family: "SFMono-Regular", Consolas, monospace;
		font-size: 13px;
	}

	.setup-input:focus {
		border-color: #007acc;
		box-shadow: 0 0 0 3px rgba(0, 122, 204, 0.2);
	}

	.setup-input::placeholder {
		color: #777777;
	}

	.setup-save {
		width: 100%;
		min-height: 46px;
		margin-top: 14px;
		border: 0;
		border-radius: 10px;
		background: var(--accent);
		color: #ffffff;
		font: inherit;
		font-size: 14px;
		font-weight: 650;
		cursor: pointer;
		transition: background 0.2s, transform 0.1s;
	}

	.setup-save:hover {
		background: var(--accent-hover);
	}

	.setup-save:active {
		transform: scale(0.99);
	}

	.setup-error {
		min-height: 20px;
		margin: 10px 0 0;
		color: #f48771;
		font-size: 13px;
		line-height: 1.5;
	}

	.setup-note {
		margin: 14px 0 0;
		color: #858585;
		font-size: 12px;
		line-height: 1.6;
	}

	.container {
		width: min(880px, calc(100% - 40px));
		margin: 0 auto;
		padding: 96px 0 88px;
	}

	.header {
		margin-bottom: 34px;
	}

	.logo {
		display: inline-flex;
		align-items: center;
		gap: 9px;
		margin-bottom: 16px;
		color: #75beff;
		font-size: 11px;
		font-weight: 700;
		letter-spacing: 0.1em;
		text-transform: uppercase;
	}

	h1 {
		margin: 0;
		color: var(--ink);
		font-size: 42px;
		font-weight: 750;
		letter-spacing: 0;
		line-height: 1.18;
	}

	.description {
		max-width: 560px;
		margin: 14px 0 0;
		color: var(--muted);
		font-size: 15px;
		line-height: 1.75;
	}

	.input-bar {
		display: flex;
		align-items: center;
		gap: 10px;
		padding: 8px;
		border: 1px solid var(--line);
		border-radius: 20px;
		background: var(--surface);
		box-shadow: 0 14px 36px rgba(0, 0, 0, 0.2);
		transition: border-color 0.2s, box-shadow 0.2s;
	}

	.input-bar:focus-within {
		border-color: #007acc;
		box-shadow: 0 0 0 3px rgba(0, 122, 204, 0.2), 0 14px 36px rgba(0, 0, 0, 0.22);
	}

	.input-bar input {
		flex: 1;
		min-width: 0;
		height: 50px;
		padding: 0 12px;
		border: 0;
		outline: 0;
		background: transparent;
		color: var(--ink);
		font-family: inherit;
		font-size: 15px;
	}

	.input-bar input::placeholder {
		color: #858585;
	}

	.generate-button {
		flex-shrink: 0;
		height: 50px;
		padding: 0 18px;
		border: 0;
		border-radius: 12px;
		background: var(--accent);
		color: #ffffff;
		font-size: 13px;
		font-weight: 700;
		cursor: pointer;
		transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
	}

	.generate-button:hover {
		background: var(--accent-hover);
		box-shadow: 0 5px 14px rgba(0, 122, 204, 0.22);
	}

	.generate-button:active {
		transform: scale(0.98);
	}

	.generate-button:disabled {
		opacity: 0.6;
		cursor: wait;
	}

	.error {
		display: none;
		flex-direction: column;
		align-items: flex-start;
		gap: 4px;
		margin-top: 16px;
		padding: 14px 20px;
		border: 1px solid #6b3636;
		border-radius: 20px;
		background: #3a2323;
		color: #f48771;
		font-family: inherit;
		font-size: 13px;
		line-height: 1.6;
		text-align: left;
		white-space: pre-wrap;
		word-break: break-word;
	}

	.error.visible {
		display: flex;
	}

	.error-title {
		width: 100%;
		text-align: left;
		white-space: normal;
		color: #f48771;
		font-size: 24px;
		font-weight: 700;
		line-height: 2;
	}

	#errorMessage {
		width: 100%;
		white-space: pre-wrap;
	}

	.results {
		display: none;
		margin-top: 38px;
	}

	.results.visible {
		display: flex;
		flex-wrap: wrap;
		align-items: flex-start;
		gap: 10px;
	}

	.results.visible .result-card {
		animation: result-enter 0.45s ease-out both;
	}

	.results.visible .result-card:nth-of-type(2) {
		animation-delay: 0.1s;
	}

	.results.visible .result-card:nth-of-type(3) {
		animation-delay: 0.2s;
	}

	.results.visible .result-card:nth-of-type(4) {
		animation-delay: 0.3s;
	}

	.results.visible .result-card:nth-of-type(5) {
		animation-delay: 0.4s;
	}

	.results.visible .result-card:nth-of-type(6) {
		animation-delay: 0.5s;
	}

	@keyframes result-enter {
		from {
			opacity: 0;
			transform: translateY(12px);
		}

		to {
			opacity: 1;
			transform: translateY(0);
		}
	}

	.results-header {
		display: flex;
		align-items: center;
		justify-content: space-between;
		flex: 0 0 100%;
		margin-bottom: 4px;
	}

	.results-title {
		color: var(--ink);
		font-size: 17px;
		font-weight: 700;
	}

	.results-subtitle {
		color: var(--muted);
		font-size: 12px;
	}

	.result-card {
		display: flex;
		align-items: center;
		gap: 18px;
		width: fit-content;
		max-width: 100%;
		padding: 18px;
		border: 1px solid #3c3c3c;
		border-radius: 20px;
		background: var(--surface);
		box-shadow: 0 5px 18px rgba(0, 0, 0, 0.16);
		transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
	}

	.result-card:hover {
		transform: translateY(-2px);
		border-color: #505050;
		box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
	}

	.result-info {
		flex: 0 1 auto;
		min-width: 0;
	}

	.result-type {
		display: block;
		margin-bottom: 6px;
		color: var(--accent);
		font-size: 11px;
		font-weight: 700;
		letter-spacing: 0.05em;
	}

	.result-type--camel-case {
		color: #9cdcfe;
	}

	.result-type--pascal-case {
		color: #4ec9b0;
	}

	.result-type--snake-case {
		color: #dcdcaa;
	}

	.result-type--kebab-case {
		color: #ce9178;
	}

	.result-type--constant-case {
		color: #c586c0;
	}

	.variable-name {
		display: block;
		overflow: hidden;
		color: #d4d4d4;
		font-family: "SFMono-Regular", Consolas, monospace;
		font-size: 15px;
		text-overflow: ellipsis;
		white-space: nowrap;
	}

	.copy-button {
		display: grid;
		place-items: center;
		flex-shrink: 0;
		width: 36px;
		height: 36px;
		padding: 0;
		border: 1px solid #454545;
		border-radius: 10px;
		background: #333333;
		color: #cccccc;
		cursor: pointer;
		transition: background 0.2s, color 0.2s, border-color 0.2s;
	}

	.copy-button svg {
		width: 20px;
		height: 20px;
		fill: none;
		stroke: currentColor;
		stroke-linecap: round;
		stroke-linejoin: round;
		stroke-width: 1.75;
	}

	.copy-button:hover {
		border-color: #007acc;
		background: #2a2d2e;
		color: #75beff;
	}

	.copy-button.copied {
		border-color: #3e7047;
		background: #263b2a;
		color: #89d185;
	}

	.status {
		display: none;
		margin-top: 12px;
		color: var(--muted);
		font-size: 12px;
	}

	.status.visible {
		display: block;
	}

	@media (max-width: 600px) {
		.setup-panel {
			padding: 26px 22px;
		}

		.container {
			width: min(100% - 32px, 520px);
			padding: 64px 0 56px;
		}

		h1 {
			font-size: 32px;
		}

		.input-bar {
			gap: 6px;
			padding: 6px;
		}

		.generate-button {
			padding: 0 14px;
		}

		.result-card {
			padding: 15px;
		}
	}
</style>

</head>

<body>

<main class="setup-screen" id="setupScreen">
	<form class="setup-panel" id="apiKeyForm">
		<p class="setup-eyebrow">GEMINI / SETUP</p>
		<h1>Gemini API Key</h1>
		<p class="setup-description">변수명 생성을 위해 API 키를 입력해 주세요.</p>
		<label class="setup-label" for="apiKeyInput">API 키</label>
		<input
			class="setup-input"
			id="apiKeyInput"
			type="password"
			placeholder="AIza..."
			autocomplete="new-password"
			spellcheck="false"
			required
		>
		<button class="setup-save" type="submit">저장</button>
		<p class="setup-error" id="setupError" role="alert" aria-live="polite"></p>
		<p class="setup-note">키는 이 브라우저의 localStorage에 저장되어 다음 방문부터 자동으로 사용됩니다.</p>
	</form>
</main>

<main class="container" id="app" hidden>

	<header class="header">

		<div class="logo">
		</div>

		<h1>
			변수명 생성기
		</h1>

		<p class="description">
			영어 변수명 추천 웹사이트
		</p>

	</header>


	<!-- 입력 -->

	<form
		class="input-bar"
		id="variableForm"
	>

		<input
			id="description"
			type="text"
			placeholder="예: 플레이어의 현재 체력"
			autocomplete="off"
		>

		<button
			class="generate-button"
			id="generateButton"
			type="submit"
		>
			변수명 생성
		</button>

	</form>


	<!-- 상태 -->

	<div
		class="status"
		id="status"
	>
		Gemini가 변수명을 생성하는 중...
	</div>


	<!-- 오류 -->

	<div
		class="error"
		id="error"
		role="alert"
		aria-live="polite"
	>

		<div class="error-title">오류가 발생했습니다.</div>

		<div id="errorMessage"></div>

	</div>


	<!-- 결과 -->

	<section
		class="results"
		id="results"
	>

		<div class="results-header">

			<span class="results-title">
				생성된 변수명
			</span>
			
		</div>


		<!-- camelCase -->

		<div class="result-card">

			<div class="result-info">

				<span class="result-type result-type--camel-case">
					camelCase
				</span>

				<span
					class="variable-name"
					id="camelCase"
				></span>

			</div>

			<button
				class="copy-button"
				data-target="camelCase"
				aria-label="camelCase 변수명 복사"
				title="복사"
				type="button"
			>
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<rect x="8" y="8" width="13" height="13" rx="2"></rect>
					<path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
				</svg>
			</button>

		</div>


		<!-- PascalCase -->

		<div class="result-card">

			<div class="result-info">

				<span class="result-type result-type--pascal-case">
					PascalCase
				</span>

				<span
					class="variable-name"
					id="pascalCase"
				></span>

			</div>

			<button
				class="copy-button"
				data-target="pascalCase"
				aria-label="PascalCase 변수명 복사"
				title="복사"
				type="button"
			>
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<rect x="8" y="8" width="13" height="13" rx="2"></rect>
					<path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
				</svg>
			</button>

		</div>


		<!-- snake_case -->

		<div class="result-card">

			<div class="result-info">

				<span class="result-type result-type--snake-case">
					snake_case
				</span>

				<span
					class="variable-name"
					id="snakeCase"
				></span>

			</div>

			<button
				class="copy-button"
				data-target="snakeCase"
				aria-label="snake_case 변수명 복사"
				title="복사"
				type="button"
			>
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<rect x="8" y="8" width="13" height="13" rx="2"></rect>
					<path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
				</svg>
			</button>

		</div>

		<!-- kebab-case -->

		<div class="result-card">

			<div class="result-info">

				<span class="result-type result-type--kebab-case">
					kebab-case
				</span>

				<span
					class="variable-name"
					id="kebabCase"
				></span>

			</div>

			<button
				class="copy-button"
				data-target="kebabCase"
				aria-label="kebab-case 변수명 복사"
				title="복사"
				type="button"
			>
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<rect x="8" y="8" width="13" height="13" rx="2"></rect>
					<path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
				</svg>
			</button>

		</div>

		<!-- CONSTANT_CASE -->

		<div class="result-card">

			<div class="result-info">

				<span class="result-type result-type--constant-case">
					CONSTANT_CASE
				</span>

				<span
					class="variable-name"
					id="constantCase"
				></span>

			</div>

			<button
				class="copy-button"
				data-target="constantCase"
				aria-label="CONSTANT_CASE 변수명 복사"
				title="복사"
				type="button"
			>
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<rect x="8" y="8" width="13" height="13" rx="2"></rect>
					<path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
				</svg>
			</button>

		</div>

	</section>

</main>


<script>

	// ==================================================
	// Gemini 설정
	// ==================================================

	/*
		여기에 본인의 Gemini API Key를 입력하세요.
	*/

	const API_KEY_STORAGE_KEY = "variableGenerator.geminiApiKey";
	let apiKey = "";


	/*
		변수명 생성에 사용할 모델
	*/

	const MODEL = "gemini-3.5-flash-lite";


	/*
		Generate Content API 주소
	*/

	const API_URL =
		`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;


	// ==================================================
	// DOM
	// ==================================================

	const form =
		document.getElementById("variableForm");

	const input =
		document.getElementById("description");

	const button =
		document.getElementById("generateButton");

	const results =
		document.getElementById("results");

	const error =
		document.getElementById("error");

	const errorMessage =
		document.getElementById("errorMessage");

	const status =
		document.getElementById("status");

	const setupScreen =
		document.getElementById("setupScreen");

	const apiKeyForm =
		document.getElementById("apiKeyForm");

	const apiKeyInput =
		document.getElementById("apiKeyInput");

	const setupError =
		document.getElementById("setupError");

	const app =
		document.getElementById("app");


	const camelCase =
		document.getElementById("camelCase");

	const pascalCase =
		document.getElementById("pascalCase");

	const snakeCase =
		document.getElementById("snakeCase");

	const constantCase =
		document.getElementById("constantCase");

	const kebabCase =
		document.getElementById("kebabCase");

	function showApp() {
		setupScreen.hidden = true;
		app.hidden = false;
	}

	try {
		apiKey = localStorage.getItem(API_KEY_STORAGE_KEY)?.trim() || "";
		if (apiKey) showApp();
	} catch {
		setupError.textContent = "브라우저 저장소를 사용할 수 없습니다. 사이트 저장소 설정을 확인해 주세요.";
	}

	apiKeyForm.addEventListener("submit", (event) => {
		event.preventDefault();
		setupError.textContent = "";

		const enteredKey = apiKeyInput.value.trim();
		if (!enteredKey) {
			setupError.textContent = "Gemini API 키를 입력해 주세요.";
			apiKeyInput.focus();
			return;
		}

		try {
			localStorage.setItem(API_KEY_STORAGE_KEY, enteredKey);
			apiKey = enteredKey;
			showApp();
		} catch {
			setupError.textContent = "API 키를 저장하지 못했습니다. 브라우저 저장소 설정을 확인해 주세요.";
		}
	});


	// ==================================================
	// 오류 표시
	// ==================================================

	function showError(message) {

		errorMessage.textContent = message;

		error.classList.add("visible");

	}


	function hideError() {

		errorMessage.textContent = "";

		error.classList.remove("visible");

	}


	// ==================================================
	// 상태 표시
	// ==================================================

	function showStatus() {

		status.classList.add("visible");

	}


	function hideStatus() {

		status.classList.remove("visible");

	}


	// ==================================================
	// Gemini 요청
	// ==================================================

	async function generateVariableNames(description) {

		const prompt = `

		너는 프로그래밍 변수명 전문 도우미다.

		사용자가 입력한 한국어 설명을 분석해서
		실제 프로그래밍에서 자연스럽게 사용할 수 있는
		영어 변수명을 만들어라.

		사용자 입력:
		${description}

		반드시 다음 JSON 형식으로만 응답해라.

		{
		"camelCase": "변수명",
		"pascalCase": "변수명",
		"snake_case": "변수명",
		"constantCase": "변수명",
		"kebabCase": "변수명"
		}

		규칙:

		변수명은 영어로 작성한다.
		의미를 정확하게 유지한다.
		불필요하게 긴 변수명을 만들지 않는다.
		실제 개발자가 사용할 만한 자연스러운 이름을 사용한다.
		camelCase는 첫 단어를 소문자로 한다.
		PascalCase는 첫 단어를 대문자로 한다.
		snake_case는 모든 단어를 소문자로 하고 _로 구분한다.
		CONSTANT_CASE는 모든 단어를 대문자로 하고 _로 구분한다.
		kebab-case는 모든 단어를 소문자로 하고 -로 구분한다.
		설명을 추가하지 않는다.
		Markdown을 사용하지 않는다.

		`;

		const response = await fetch(`${API_URL}?key=${encodeURIComponent(apiKey)}`, {
			method: "POST",
			headers: {
				"Content-Type": "application/json"
			},
			body: JSON.stringify({
				contents: [{
					parts: [{ text: prompt }]
				}],
				generationConfig: {
					responseMimeType: "application/json"
				}
			})
		});

		if (!response.ok) {
			throw new Error("변수명을 생성하지 못했습니다.");
		}

		const data = await response.json();
		const text = data.candidates?.[0]?.content?.parts?.[0]?.text;

		if (!text) {
			throw new Error("API 응답이 올바르지 않습니다.");
		}

		return JSON.parse(text.replace(/^```json\s*|\s*```$/g, "").trim());
	}

	form.addEventListener("submit", async (event) => {
		event.preventDefault();

		const description = input.value.trim();
		if (!description) {
			showError("변수명 설명을 입력해 주세요.");
			return;
		}

		if (!apiKey) {
			showError("Gemini API 키를 입력해 주세요.");
			return;
		}

		hideError();
		showStatus();
		button.disabled = true;

		try {
			const names = await generateVariableNames(description);
			results.classList.remove("visible");
			camelCase.textContent = names.camelCase || "";
			pascalCase.textContent = names.pascalCase || "";
			snakeCase.textContent = names.snake_case || "";
			constantCase.textContent = names.constantCase || "";
			kebabCase.textContent = names.kebabCase || "";
			requestAnimationFrame(() => {
				results.classList.add("visible");
			});
		} catch (error) {
			showError(error instanceof SyntaxError
				? "API 응답을 해석하지 못했습니다."
				: error.message);
		} finally {
			hideStatus();
			button.disabled = false;
		}
	});

	document.querySelectorAll(".copy-button").forEach((copyButton) => {
		copyButton.addEventListener("click", async () => {
			const target = document.getElementById(copyButton.dataset.target);
			if (!target?.textContent) return;

			try {
				await navigator.clipboard.writeText(target.textContent);
				copyButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>';
				copyButton.setAttribute("aria-label", "복사 완료");
				copyButton.title = "복사 완료";
				copyButton.classList.add("copied");

				window.setTimeout(() => {
					copyButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path></svg>';
					copyButton.setAttribute("aria-label", `${target.id} 변수명 복사`);
					copyButton.title = "복사";
					copyButton.classList.remove("copied");
				}, 1200);
			} catch {
				showError("클립보드에 복사하지 못했습니다.");
			}
		});
	});

</script>
